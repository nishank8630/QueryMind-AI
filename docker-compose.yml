version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: querymind_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: querymind_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d querymind_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: querymind_backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:password123@postgres:5432/querymind_db
      APP_ENV: production
      APP_MODE: demo
      QDRANT_URL: local
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: querymind_frontend
    environment:
      API_HOST: backend
      API_PORT: 8000
    ports:
      - "8501:8501"
    depends_on:
      - backend

volumes:
  pgdata:
